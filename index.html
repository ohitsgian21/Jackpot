<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jackpot</title>
<style>
  :root { color-scheme: light dark; --teal: #00796b; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) { body { background: #121212; color: #eaeaea; } }
  main { max-width: 420px; text-align: center; padding: 32px; }
  .badge {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%;
    background: var(--teal); color: white; display: flex;
    align-items: center; justify-content: center; font-size: 28px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { line-height: 1.5; opacity: 0.8; margin: 0; }
</style>
</head>
<body>
  <main>
    <div class="badge">✓</div>
    <h1>You're confirmed</h1>
    <p>Your Jackpot account is ready. You can close this tab and sign in from the app.</p>
  </main>
</body>
</html>
